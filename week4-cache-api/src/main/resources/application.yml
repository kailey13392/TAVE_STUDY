# ============================================================
# 공통 설정 (모든 프로파일에 적용)
#  - 프로파일별로 달라지는 값은 application-local.yml / application-prod.yml 에 둔다.
#  - 같은 키가 양쪽에 있으면 "프로파일 파일 쪽이 이긴다" (덮어쓰기)
# ============================================================
spring:
  application:
    name: cache-api
  profiles:
    # 아무 프로파일도 안 주고 실행하면 local 로 뜬다.
    # prod 로 띄우려면: SPRING_PROFILES_ACTIVE=prod  또는  --spring.profiles.active=prod
    default: local
  jpa:
    open-in-view: false   # 트랜잭션이 끝나면 DB 커넥션도 바로 반납 (권장 설정)
  cache:
    # 미리 만들어 둘 캐시 이름. (CacheConfig.ITEM / ITEM_PAGE 와 같아야 함)
    cache-names: item,itemPage

management:
  endpoints:
    web:
      exposure:
        include: health   # 기본은 health 만 웹으로 노출. local 에서 더 연다
